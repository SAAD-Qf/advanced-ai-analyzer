<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Enhanced Crypto Trading Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #151932;
      --bg-card: #1a1f3a;
      --text-primary: #ffffff;
      --text-secondary: #8b92b8;
      --accent-green: #00ff88;
      --accent-red: #ff4757;
      --accent-yellow: #ffd700;
      --accent-blue: #4a90e2;
      --border: #2a2f4a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(74, 144, 226, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 1920px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicators {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 8px;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-change {
      font-size: 14px;
      margin-top: 4px;
    }

    .stat-change.positive { color: var(--accent-green); }
    .stat-change.negative { color: var(--accent-red); }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 255, 136, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .symbol-name {
      font-size: 24px;
      font-weight: 700;
    }

    .price {
      font-size: 32px;
      font-weight: 700;
      margin: 12px 0;
    }

    .price-change {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .price-change.positive {
      background: rgba(0, 255, 136, 0.2);
      color: var(--accent-green);
    }

    .price-change.negative {
      background: rgba(255, 71, 87, 0.2);
      color: var(--accent-red);
    }

    /* Signal Badge */
    .signal-badge {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 12px 0;
    }

    .signal-badge.STRONG_BUY {
      background: linear-gradient(135deg, #00ff88, #00cc6a);
      color: #000;
      box-shadow: 0 4px 12px rgba(0, 255, 136, 0.4);
    }

    .signal-badge.BUY {
      background: rgba(0, 255, 136, 0.3);
      color: var(--accent-green);
    }

    .signal-badge.HOLD {
      background: rgba(255, 215, 0, 0.3);
      color: var(--accent-yellow);
    }

    .signal-badge.SELL {
      background: rgba(255, 71, 87, 0.3);
      color: var(--accent-red);
    }

    .signal-badge.STRONG_SELL {
      background: linear-gradient(135deg, #ff4757, #cc0022);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .confidence {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
      text-transform: uppercase;
    }

    .confidence.HIGH {
      background: rgba(0, 255, 136, 0.2);
      color: var(--accent-green);
    }

    .confidence.MEDIUM {
      background: rgba(255, 215, 0, 0.2);
      color: var(--accent-yellow);
    }

    .confidence.LOW {
      background: rgba(139, 146, 184, 0.2);
      color: var(--text-secondary);
    }

    /* Indicators */
    .indicators {
      margin: 16px 0;
    }

    .indicator-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .indicator-row:last-child {
      border-bottom: none;
    }

    .indicator-label {
      color: var(--text-secondary);
    }

    .indicator-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Advanced Metrics */
    .advanced-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
    }

    .metric {
      text-align: center;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 4px;
    }

    .metric-value.bullish { color: var(--accent-green); }
    .metric-value.bearish { color: var(--accent-red); }
    .metric-value.neutral { color: var(--text-secondary); }

    /* AI Analysis */
    .ai-section {
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(74, 144, 226, 0.1), rgba(0, 255, 136, 0.1));
      border-radius: 12px;
      border: 1px solid rgba(74, 144, 226, 0.3);
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent-blue);
    }

    .ai-content {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .ai-factors {
      margin-top: 12px;
    }

    .ai-factor {
      padding: 8px 12px;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    /* Trade Setup */
    .trade-setup {
      margin-top: 16px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
    }

    .trade-setup h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .trade-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .trade-label {
      color: var(--text-secondary);
    }

    .trade-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Performance Card */
    .performance-card {
      background: linear-gradient(135deg, rgba(74, 144, 226, 0.2), rgba(0, 255, 136, 0.2));
      border: 1px solid rgba(0, 255, 136, 0.3);
      grid-column: span 2;
    }

    .performance-card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .balance {
      font-size: 48px;
      font-weight: 700;
      margin: 16px 0;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .roi {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .roi.positive { color: var(--accent-green); }
    .roi.negative { color: var(--accent-red); }

    /* Trades Table */
    .trades-section {
      margin-top: 24px;
    }

    .trades-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .trades-table thead {
      background: var(--bg-secondary);
    }

    .trades-table th {
      padding: 12px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
    }

    .trades-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .trades-table tr:hover {
      background: var(--bg-secondary);
    }

    .pnl-positive {
      color: var(--accent-green);
      font-weight: 700;
    }

    .pnl-negative {
      color: var(--accent-red);
      font-weight: 700;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Accuracy Badge */
    .accuracy-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      color: #000;
      margin-left: 8px;
    }

    /* Last Update */
    .last-update {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 24px;
      padding: 16px;
      background: var(--bg-secondary);
      border-radius: 12px;
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      }
      .performance-card {
        grid-column: span 1;
      }
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .stats-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .advanced-metrics {
        grid-template-columns: 1fr;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <h1>🚀 Enhanced Crypto Trading Dashboard</h1>
        <div class="status-indicators">
          <div class="status-item">
            <div class="status-dot"></div>
            <span>Live</span>
          </div>
          <div class="status-item">
            <span id="symbolCount">0 Symbols</span>
          </div>
          <div class="status-item">
            <span id="openPositions">0 Open</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Balance</div>
        <div class="stat-value" id="balance">$0.00</div>
        <div class="stat-change" id="balanceChange">+0.00%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total P&L</div>
        <div class="stat-value" id="totalPnL">$0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value" id="winRate">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Trades</div>
        <div class="stat-value" id="totalTrades">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Open Positions</div>
        <div class="stat-value" id="openPos">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Streak</div>
        <div class="stat-value" id="streak">0</div>
      </div>
    </div>

    <!-- Symbol Cards Grid -->
    <div class="grid" id="symbolsGrid">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading market data...</p>
      </div>
    </div>

    <!-- Recent Trades -->
    <div class="card trades-section">
      <h2 style="margin-bottom: 16px;">📊 Recent Trades</h2>
      <div id="tradesContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading trades...</p>
        </div>
      </div>
    </div>

    <div class="last-update" id="lastUpdate">Waiting for data...</div>
  </div>

  <script>
    let ws;
    let reconnectTimeout;

    function connectWebSocket() {
      ws = new WebSocket(`ws://${window.location.host}`);

      ws.onopen = () => {
        console.log('✅ WebSocket connected');
        clearTimeout(reconnectTimeout);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'analysis') {
          updateAnalysis(data.data);
        } else if (data.type === 'performance') {
          updatePerformance(data.data);
        } else if (data.type === 'trades') {
          updateTrades(data.data);
        }

        updateLastUpdate();
      };

      ws.onclose = () => {
        console.log('❌ WebSocket disconnected, reconnecting...');
        reconnectTimeout = setTimeout(connectWebSocket, 5000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        ws.close();
      };
    }

    function updateAnalysis(analyses) {
      const grid = document.getElementById('symbolsGrid');
      grid.innerHTML = '';

      document.getElementById('symbolCount').textContent = `${analyses.length} Symbols`;

      analyses.forEach(analysis => {
        const card = createSymbolCard(analysis);
        grid.appendChild(card);
      });
    }

    function createSymbolCard(data) {
      const { symbol, analysis, signal, tradeSetup, aiAnalysis } = data;

      const card = document.createElement('div');
      card.className = 'card';

      const priceChangeClass = analysis.priceChange24h >= 0 ? 'positive' : 'negative';
      const priceChangeSign = analysis.priceChange24h >= 0 ? '+' : '';

      let aiSection = '';
      if (aiAnalysis) {
        const keyFactors = aiAnalysis.keyFactors || [];
        aiSection = `
          <div class="ai-section">
            <div class="ai-header">
              🤖 AI Analysis
              <span class="confidence ${aiAnalysis.confidence > 70 ? 'HIGH' : aiAnalysis.confidence > 50 ? 'MEDIUM' : 'LOW'}">
                ${aiAnalysis.confidence}% Confidence
              </span>
            </div>
            <div class="ai-content">
              Signal: ${aiAnalysis.signal} | Risk: ${aiAnalysis.riskLevel}
            </div>
            ${keyFactors.length > 0 ? `
              <div class="ai-factors">
                ${keyFactors.map(f => `<div class="ai-factor">• ${f}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="card-header">
          <div class="symbol-name">${symbol}</div>
          <div class="price-change ${priceChangeClass}">
            ${priceChangeSign}${analysis.priceChange24h.toFixed(2)}%
          </div>
        </div>

        <div class="price">$${analysis.price.toFixed(4)}</div>

        <div>
          <span class="signal-badge ${signal.action.replace(' ', '_')}">${signal.action}</span>
          <span class="confidence ${signal.confidence}">${signal.confidence}</span>
          ${signal.accuracy ? `<span class="accuracy-badge">~${signal.accuracy}%</span>` : ''}
        </div>

        <div class="indicators">
          <div class="indicator-row">
            <span class="indicator-label">RSI (14)</span>
            <span class="indicator-value">${analysis.rsi.toFixed(2)}</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-label">EMA 20/50</span>
            <span class="indicator-value">$${analysis.ema20.toFixed(4)} / $${analysis.ema50.toFixed(4)}</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-label">Order Book</span>
            <span class="indicator-value">${analysis.orderBook.pressure} (${analysis.orderBook.bidAskRatio.toFixed(2)})</span>
          </div>
        </div>

        <div class="advanced-metrics">
          ${analysis.cvd ? `
          <div class="metric">
            <div class="metric-label">CVD</div>
            <div class="metric-value ${analysis.cvd.cvd > 0 ? 'bullish' : 'bearish'}">
              ${(analysis.cvd.cvd / 1000000).toFixed(2)}M
            </div>
          </div>` : ''}

          ${analysis.openInterest ? `
          <div class="metric">
            <div class="metric-label">Open Interest</div>
            <div class="metric-value ${analysis.openInterest.change > 0 ? 'bullish' : 'bearish'}">
              ${analysis.openInterest.change >= 0 ? '+' : ''}${analysis.openInterest.change.toFixed(1)}%
            </div>
          </div>` : ''}

          ${analysis.longShortRatio ? `
          <div class="metric">
            <div class="metric-label">L/S Ratio</div>
            <div class="metric-value ${analysis.longShortRatio.ratio > 1 ? 'bullish' : 'bearish'}">
              ${analysis.longShortRatio.ratio.toFixed(2)}
            </div>
          </div>` : ''}

          ${analysis.liquidations ? `
          <div class="metric">
            <div class="metric-label">Liquidations</div>
            <div class="metric-value ${analysis.liquidations.pressure === 'BULLISH' ? 'bullish' : analysis.liquidations.pressure === 'BEARISH' ? 'bearish' : 'neutral'}">
              $${(analysis.liquidations.total24h / 1000000).toFixed(2)}M
            </div>
          </div>` : ''}

          ${analysis.fundingRate !== null ? `
          <div class="metric">
            <div class="metric-label">Funding Rate</div>
            <div class="metric-value ${analysis.fundingRate > 0 ? 'bearish' : 'bullish'}">
              ${(analysis.fundingRate * 100).toFixed(4)}%
            </div>
          </div>` : ''}
        </div>

        ${aiSection}

        ${tradeSetup ? `
        <div class="trade-setup">
          <h3>💰 Trade Setup</h3>
          <div class="trade-row">
            <span class="trade-label">Entry</span>
            <span class="trade-value">$${tradeSetup.entry.toFixed(4)}</span>
          </div>
          <div class="trade-row">
            <span class="trade-label">Stop Loss</span>
            <span class="trade-value">$${tradeSetup.stopLoss.toFixed(4)} (-${tradeSetup.stopLossPercent.toFixed(2)}%)</span>
          </div>
          <div class="trade-row">
            <span class="trade-label">Take Profit</span>
            <span class="trade-value">$${tradeSetup.takeProfit.toFixed(4)} (+${tradeSetup.takeProfitPercent.toFixed(2)}%)</span>
          </div>
          <div class="trade-row">
            <span class="trade-label">Risk/Reward</span>
            <span class="trade-value">1:${tradeSetup.riskReward.toFixed(2)}</span>
          </div>
        </div>
        ` : ''}
      `;

      return card;
    }

    function updatePerformance(perf) {
      document.getElementById('balance').textContent = `$${perf.balance.toFixed(2)}`;
      document.getElementById('totalPnL').textContent = `${perf.totalPnL >= 0 ? '+' : ''}$${perf.totalPnL.toFixed(2)}`;
      document.getElementById('winRate').textContent = `${perf.stats.winRate.toFixed(1)}%`;
      document.getElementById('totalTrades').textContent = perf.stats.totalTrades;
      document.getElementById('openPos').textContent = perf.openPositions;
      document.getElementById('streak').textContent = perf.stats.currentStreak;
      document.getElementById('openPositions').textContent = `${perf.openPositions} Open`;

      const roiElement = document.getElementById('balanceChange');
      roiElement.textContent = `${perf.roi >= 0 ? '+' : ''}${perf.roi.toFixed(2)}%`;
      roiElement.className = `stat-change ${perf.roi >= 0 ? 'positive' : 'negative'}`;
    }

    function updateTrades(trades) {
      const container = document.getElementById('tradesContainer');

      if (!trades || trades.length === 0) {
        container.innerHTML = '<div class="loading"><p style="color: var(--text-secondary);">No trades yet</p></div>';
        return;
      }

      const table = document.createElement('table');
      table.className = 'trades-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Type</th>
            <th>Entry</th>
            <th>Exit</th>
            <th>P&L</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          ${trades.slice(0, 10).map(trade => `
            <tr>
              <td><strong>${trade.symbol}</strong></td>
              <td>${trade.type}</td>
              <td>$${trade.entryPrice.toFixed(4)}</td>
              <td>$${trade.exitPrice.toFixed(4)}</td>
              <td class="${trade.pnl >= 0 ? 'pnl-positive' : 'pnl-negative'}">
                ${trade.pnl >= 0 ? '+' : ''}$${trade.pnl.toFixed(2)} (${trade.pnlPercent.toFixed(2)}%)
              </td>
              <td>${new Date(trade.exitTime).toLocaleString()}</td>
            </tr>
          `).join('')}
        </tbody>
      `;

      container.innerHTML = '';
      container.appendChild(table);
    }

    function updateLastUpdate() {
      document.getElementById('lastUpdate').textContent = `Last update: ${new Date().toLocaleString()}`;
    }

    // Connect on load
    connectWebSocket();
  </script>
</body>
</html>
